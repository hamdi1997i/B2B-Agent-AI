name: Deploy to GitHub Pages

# Deploys the static browser build in /docs to GitHub Pages.
# No API keys or secrets required.

on:
  push:
    # Run on main and on the current default branch. The github-pages
    # environment only allows the repo's DEFAULT branch to deploy, so we
    # include both to work whether or not main has been made the default.
    branches:
      - main
      - claude/enterprise-data-collection-agent-91cxR
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages automatically if it isn't already,
          # so the workflow doesn't fail on a brand-new repo.
          enablement: true

      - name: Upload static site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
