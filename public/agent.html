<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f1c">
<title>المعاون — مساعد التاجر</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/agent.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="/icons/icon-48.png" alt="" width="28" height="28">
    <div>
      <strong id="shop-name">المعاون</strong>
      <span class="sub" id="status-line">…</span>
    </div>
  </div>
  <div class="top-actions">
    <button id="btn-sound" class="icon-btn" aria-pressed="true" title="الصوت">🔊</button>
    <button id="btn-panel" class="icon-btn" title="الدفتر">📒</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="feed" aria-live="polite">
  <section class="hero">
    <div class="hero-bot">🤖</div>
    <h1>شنوة نعملك؟</h1>
    <p>احكي بالتونسي عادي — أنا نسجّل ونحسب ونذكّرك.</p>
  </section>
</main>

<div id="chips" class="chips">
  <button data-say="شنوة عندي اليوم؟">شنوة عندي اليوم؟</button>
  <button data-say="شكون ما خلّصش؟">شكون ما خلّصش؟</button>
  <button data-say="قداش رابحنا اليوم؟">قداش رابحنا اليوم؟</button>
  <button data-say="شنوة عندي غدوة؟">شنوة عندي غدوة؟</button>
</div>

<footer class="composer">
  <button id="mic" class="mic" title="احكي">
    <span class="mic-glyph" aria-hidden="true"></span>
    <span class="sr-only">احكي</span>
  </button>
  <input id="text" type="text" enterkeyhint="send" placeholder="ولا اكتب هوني…" autocomplete="off">
  <button id="send" class="icon-btn send" title="ابعث">➤</button>
</footer>

<!-- Écoute vocale -->
<div id="listening" class="overlay" hidden>
  <div class="pulse"></div>
  <p id="partial">نسمع فيك…</p>
  <button id="stop-listen" class="ghost">وقّف</button>
</div>

<!-- Le carnet: activité, impayés, réglages -->
<aside id="panel" class="panel" hidden>
  <div class="panel-head">
    <strong>الدفتر</strong>
    <button id="panel-close" class="icon-btn">✕</button>
  </div>

  <div class="stats" id="stats"></div>

  <h3>آخر العمليات</h3>
  <ul id="journal" class="list"></ul>

  <h3>الكريدي المفتوح</h3>
  <ul id="impayes" class="list"></ul>

  <h3>الحانوت</h3>
  <form id="shop-form" class="form">
    <label>الاسم <input name="nom" type="text"></label>
    <label>التليفون <input name="tel" type="tel" inputmode="tel"></label>
    <label>العنوان <input name="adresse" type="text"></label>
    <label>المعرّف الجبائي <input name="matriculeFiscal" type="text"></label>
    <label>TVA % <input name="tva" type="number" step="0.5" inputmode="decimal"></label>
    <button type="submit" class="ghost">سجّل</button>
  </form>

  <button id="btn-newchat" class="ghost wide">حوار جديد</button>
  <p class="foot">المعطيات الكل تتسجّل في السرفور متاعك برك.</p>
</aside>

<script src="/agent.js"></script>
</body>
</html>
